<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#302331" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Homeward Hound</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%226%22 y=%2224%22 width=%2246%22 height=%2220%22 rx=%2210%22 fill=%22%23B66B38%22 stroke=%22%23302331%22 stroke-width=%224%22/%3E%3Ccircle cx=%2250%22 cy=%2224%22 r=%2210%22 fill=%22%23B66B38%22 stroke=%22%23302331%22 stroke-width=%224%22/%3E%3Crect x=%2240%22 y=%2226%22 width=%225%22 height=%2216%22 fill=%22%2342B7B0%22/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #302331; overflow: hidden;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      /* Fixed to the frame edges so page padding never shrinks the play area. */
  #game { position: fixed; inset: 0; width: 100%; height: 100%; }
      #game canvas { display: block; touch-action: none; }
      #rotate-hint {
        display: none; position: fixed; inset: 0; z-index: 10;
        align-items: center; justify-content: center; text-align: center;
        color: #FFE1AA; font: bold 22px "Trebuchet MS", sans-serif;
        background: rgba(48, 35, 49, 0.92); pointer-events: none; padding: 24px;
      }
      @media (orientation: portrait) and (max-width: 820px) {
        #rotate-hint { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">Turn your phone sideways —<br />tiny legs need a long view.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
