<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homeward Hound AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #f4eee2; font-family: system-ui, sans-serif; }
    model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
    #ar { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 22px;
          border: 0; border-radius: 999px; background: #42b7b0; color: #fff; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <model-viewer src="hound.glb" alt="Homeward Hound, a cartoon dachshund puppy" autoplay animation-name="Idle"
    ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
    camera-controls touch-action="pan-y" camera-orbit="35deg 75deg auto" shadow-intensity="1" exposure="1.05">
    <button slot="ar-button" id="ar">See the pup in your room</button>
  </model-viewer>
</body>
</html>
