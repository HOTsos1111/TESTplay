name: Sho Call checks

on:
  push:
    paths: ['sho-call/**', '.github/workflows/sho-call.yml']
  pull_request:
    paths: ['sho-call/**', '.github/workflows/sho-call.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sho-call
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sho-call/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
